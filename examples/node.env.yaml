trojan_panel:
  # mode is kept for compatibility with the original node env.yaml style.
  mode: "deploy"

  # Public domain for this node. DNS A/AAAA record must point to this VPS.
  node_hostname: "node.example.com"
  node_mail: "admin@example.com"

  # The node-side Caddy uses 80 -> 8863 by default so port 443 remains free for proxy nodes.
  node_caddy_http_port: "80"
  node_caddy_https_port: "8863"

  # Optional image override. Use your customized core image if needed.
  caddy_image: "caddy:2.8.4"
  core_image: "jonssonyan/trojan-panel-core"

  # Web-side MariaDB connection.
  mariadb_host: "panel.example.com"
  mariadb_port: "9507"
  mariadb_user: "root"
  mariadb_password: "your-mariadb-password"
  database: "trojan_panel_db"
  account_table: "account"

  # Web-side Redis connection.
  redis_host: "panel.example.com"
  redis_port: "6378"
  redis_password: "your-redis-password"

  # Node-side core ports.
  grpc_port: "8100"
  core_port: "8082"

  # Set force to "1" to recreate existing containers.
  force: "0"
  # Used by remove-node. Set to "1" to delete generated data directories too.
  purge_data: "0"

trojan_panel:
  # mode is kept for compatibility with the original node env.yaml style.
  mode: "deploy"

  # Public domain for the web management panel. DNS A/AAAA record must point to this VPS.
  web_hostname: "panel.example.com"
  web_mail: "admin@example.com"

  # Optional image overrides. Keep defaults unless you publish customized images.
  caddy_image: "caddy:2.8.4"
  mariadb_image: "mariadb:10.7.3"
  redis_image: "redis:6.2.7"
  panel_image: "jonssonyan/trojan-panel"
  ui_image: "jonssonyan/trojan-panel-ui"

  # Local web-side service ports.
  mariadb_port: "9507"
  redis_port: "6378"
  panel_port: "8081"
  ui_port: "8888"

  # Leave empty to auto-generate and print random passwords after deployment.
  mariadb_password: ""
  redis_password: ""

  # Set force to "1" to recreate existing containers.
  force: "0"
  # Used by remove-web. Set to "1" to delete generated data directories too.
  purge_data: "0"

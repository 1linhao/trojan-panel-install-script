trojan_panel:
  # Source deployment for testing without publishing Docker images.
  mode: "deploy"

  # Public domain for the web management panel. DNS A/AAAA record must point to this VPS.
  web_hostname: "panel-test.example.com"
  web_mail: "admin@example.com"

  # Source repositories and branches to test.
  panel_repo: "https://github.com/1linhao/trojan-panel.git"
  panel_branch: "feature/sing-box-subscribe"
  ui_repo: "https://github.com/1linhao/trojan-panel-ui.git"
  ui_branch: "feature/sing-box-subscribe"

  # Go is downloaded directly only when no go command exists on the VPS.
  go_version: "1.22.5"
  source_base: "/tpdata/source"

  # Caddy/MariaDB/Redis still run as containers in source test mode.
  caddy_image: "caddy:2.8.4"
  mariadb_image: "mariadb:10.7.3"
  redis_image: "redis:6.2.7"

  # Local web-side service ports.
  mariadb_port: "9507"
  redis_port: "6378"
  panel_port: "8081"

  # Leave empty to auto-generate and write random passwords back to this file.
  mariadb_password: ""
  redis_password: ""

  # Set force to "1" to recreate existing containers.
  force: "0"
  # Used by remove-web. Set to "1" to delete generated data directories too.
  purge_data: "0"

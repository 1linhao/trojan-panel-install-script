trojan_panel:
  # Deploy node side on a VPS with images loaded from local tar archives.
  mode: "deploy"

  # Public domain for this node. DNS A/AAAA record must point to this VPS.
  node_hostname: "node-test.example.com"
  node_mail: "admin@example.com"

  # Directory on the VPS that contains the tar/tar.gz images copied from your local machine.
  image_bundle_dir: "/root/trojan-panel-test-images"

  node_caddy_http_port: "80"
  node_caddy_https_port: "8863"

  caddy_image: "caddy:2.8.4"
  core_image: "ghcr.io/1linhao/trojan-panel-core:test"

  # Web-side MariaDB connection.
  mariadb_host: "panel-test.example.com"
  mariadb_port: "9507"
  mariadb_user: "root"
  mariadb_password: "your-mariadb-password"
  database: "trojan_panel_db"
  account_table: "account"

  # Web-side Redis connection.
  redis_host: "panel-test.example.com"
  redis_port: "6378"
  redis_password: "your-redis-password"

  grpc_port: "8100"
  core_port: "8082"

  # force=1 recreates old containers so the newly loaded test image is used.
  force: "1"
  purge_data: "0"

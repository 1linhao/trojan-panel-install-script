trojan_panel:
  # Build one-platform test images locally and save them as a tar.gz archive.
  platform: "linux/amd64"
  image_tag: "singbox"
  output_dir: "./dist/test-images"

  # Defaults assume these repos are siblings of trojan-panel-install-script.
  panel_dir: "../trojan-panel"
  ui_dir: "../trojan-panel-ui"
  core_dir: "../trojan-panel-core"

  panel_image: "ghcr.io/1linhao/trojan-panel:singbox"
  ui_image: "ghcr.io/1linhao/trojan-panel-ui:singbox"
  core_image: "ghcr.io/1linhao/trojan-panel-core:singbox"
  official_core_image: "jonssonyan/trojan-panel-core:latest"

  build_panel: "1"
  build_ui: "1"
  build_core: "1"
  build_naiveproxy: "1"
  save_images: "1"
  archive_name: "trojan-panel-test-images-linux-amd64.tar.gz"

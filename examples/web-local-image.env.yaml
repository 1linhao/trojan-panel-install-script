trojan_panel:
  # Deploy web side on a VPS with images loaded from local tar archives.
  mode: "deploy"

  # Public domain for the web management panel. DNS A/AAAA record must point to this VPS.
  web_hostname: "panel-test.example.com"
  web_mail: "admin@example.com"

  # Directory on the VPS that contains the tar/tar.gz images copied from your local machine.
  image_bundle_dir: "/root/trojan-panel-test-images"

  caddy_image: "caddy:2.8.4"
  mariadb_image: "mariadb:10.7.3"
  redis_image: "redis:6.2.7"
  panel_image: "ghcr.io/1linhao/trojan-panel:test"
  ui_image: "ghcr.io/1linhao/trojan-panel-ui:test"

  mariadb_port: "9507"
  redis_port: "6378"
  panel_port: "8081"
  ui_port: "8888"

  # Leave empty to auto-generate and print random passwords after deployment.
  mariadb_password: ""
  redis_password: ""

  # force=1 recreates old containers so the newly loaded test image is used.
  force: "1"
  purge_data: "0"
